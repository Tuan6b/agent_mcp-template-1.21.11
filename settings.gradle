pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'agent_mcp'

// One project per supported Minecraft version: ./gradlew :26.3:runClient
['1.21.11', '26.3'].each {
	include it
	project(":$it").projectDir = file("versions/$it")
}
