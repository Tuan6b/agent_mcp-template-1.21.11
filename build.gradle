// One mod, one shared source tree (src/), built per Minecraft version by the projects in versions/.
// Both Loom flavours come from the same Loom release so they share a classloader.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}
