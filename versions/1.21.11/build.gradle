plugins {
	id 'net.fabricmc.fabric-loom-remap' // 1.21.11 is obfuscated: build against Mojang mappings, ship intermediary
}

apply from: rootProject.file('gradle/common.gradle')

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Shader stack for `runClient` only (exercises the `shader` tool); never bundled into the jar.
	modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
	// Iris's jar-in-jar libraries aren't loaded from modLocalRuntime in dev; versions match its META-INF/jars.
	localRuntime "org.anarres:jcpp:1.4.14"
	localRuntime "io.github.douira:glsl-transformer:3.0.0-pre3"
	localRuntime "org.antlr:antlr4-runtime:4.13.1"
}
